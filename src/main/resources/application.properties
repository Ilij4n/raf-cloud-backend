spring.application.name=RAF Cloud Backend

# ===============================
# DATABASE CONNECTION
# ===============================
# The URL to your specific database.
# "useSSL=false" and "serverTimezone=UTC" prevent common driver errors.
spring.datasource.url=jdbc:mysql://localhost:3306/raf_cloud_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
server.port=8080

# Your credentials
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# "update": Automatically creates/updates tables to match your Kotlin classes.
# WARNING: switching this to "create-drop" will delete your data on restart.
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in the console (Great for debugging)
spring.jpa.show-sql=true

# Formats the SQL in the console so it is readable
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate specifically that we are using MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# jwt config
oauth.jwt.secret=MySuperSecretKeyForRafCloudBackendThatMustBeVeryLong123456
oauth.jwt.expiration=1000
